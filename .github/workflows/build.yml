name: BuildModuleZIP
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create ZIP
        run: |
          zip -r HansFix.zip . -x ".github/*" -x ".git/*"
      - uses: actions/upload-artifact@v4
        with:
          name: HansFix-Module
          path: HansFix.zip
